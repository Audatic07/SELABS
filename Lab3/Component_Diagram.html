<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Kiosk UML Component Diagram</title>
<style>
  @page { size: 13.333in 8.333in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; background: #f5f7fb; }
  body { font-family: "Segoe UI", Arial, sans-serif; }
  svg { display: block; width: 1600px; height: 1000px; }
  .hero-title { font-size: 34px; font-weight: 700; fill: #ffffff; }
  .hero-subtitle { font-size: 17px; fill: #dce8f6; }
  .layer-title { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #40536f; }
  .component-name { font-size: 21px; font-weight: 700; fill: #14233b; }
  .stereotype { font-size: 14px; fill: #5c6d84; }
  .responsibility { font-size: 14px; fill: #46566f; }
  .interface-label { font-size: 14px; font-weight: 600; fill: #21334f; }
  .interface-detail { font-size: 12px; fill: #607089; }
  .legend { font-size: 13px; fill: #52637d; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 1000" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Coffee Kiosk System Layered Architecture UML Component Diagram</title>
  <desc id="diagramDesc">Five components arranged in presentation, business, and data and device layers, connected by four labeled provided and required interfaces.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#152544" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#47617f"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f7fb"/>
  <rect x="0" y="0" width="1600" height="116" fill="#163b66"/>
  <rect x="70" y="72" width="126" height="6" rx="3" fill="#f1b84b"/>
  <text x="70" y="54" class="hero-title">Coffee Kiosk System</text>
  <text x="70" y="94" class="hero-subtitle">UML component diagram · selected pattern: Layered Architecture</text>
  <g transform="translate(1270 30)">
    <rect width="260" height="56" rx="12" fill="#ffffff" opacity="0.12"/>
    <text x="22" y="24" font-size="12" font-weight="700" fill="#f1b84b" letter-spacing="1.2">LAB 3</text>
    <text x="22" y="43" font-size="14" fill="#ffffff">Component modelling</text>
  </g>

  <!-- Presentation layer -->
  <rect x="70" y="150" width="1460" height="190" rx="18" fill="#edf4fb" stroke="#c9d9ec" stroke-width="2"/>
  <text x="96" y="181" class="layer-title">PRESENTATION LAYER</text>

  <!-- Business layer -->
  <rect x="70" y="360" width="1460" height="260" rx="18" fill="#f3f0fb" stroke="#d7ceed" stroke-width="2"/>
  <text x="96" y="391" class="layer-title">BUSINESS LAYER</text>

  <!-- Data and device layer -->
  <rect x="70" y="640" width="1460" height="250" rx="18" fill="#eef8f3" stroke="#cbe4d7" stroke-width="2"/>
  <text x="96" y="671" class="layer-title">DATA AND DEVICE LAYER</text>

  <!-- Touchscreen UI component -->
  <g filter="url(#shadow)">
    <rect x="610" y="205" width="380" height="104" rx="12" fill="#ffffff" stroke="#2f6fad" stroke-width="2"/>
    <rect x="610" y="205" width="9" height="104" rx="5" fill="#2f6fad"/>
    <rect x="951" y="219" width="20" height="13" fill="none" stroke="#2f6fad" stroke-width="2"/>
    <rect x="945" y="225" width="20" height="13" fill="#ffffff" stroke="#2f6fad" stroke-width="2"/>
  </g>
  <text x="800" y="235" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="800" y="266" text-anchor="middle" class="component-name">Touchscreen UI</text>
  <text x="800" y="290" text-anchor="middle" class="responsibility">Menu selection · size choice · status display</text>

  <!-- Order manager component -->
  <g filter="url(#shadow)">
    <rect x="430" y="430" width="400" height="122" rx="12" fill="#ffffff" stroke="#7656b4" stroke-width="2.5"/>
    <rect x="430" y="430" width="9" height="122" rx="5" fill="#7656b4"/>
    <rect x="790" y="444" width="20" height="13" fill="none" stroke="#7656b4" stroke-width="2"/>
    <rect x="784" y="450" width="20" height="13" fill="#ffffff" stroke="#7656b4" stroke-width="2"/>
  </g>
  <text x="630" y="461" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="630" y="495" text-anchor="middle" class="component-name">Order Manager</text>
  <text x="630" y="521" text-anchor="middle" class="responsibility">Validates selections · calculates totals · coordinates checkout</text>

  <!-- Payment service component -->
  <g filter="url(#shadow)">
    <rect x="1060" y="430" width="380" height="122" rx="12" fill="#ffffff" stroke="#b5782b" stroke-width="2"/>
    <rect x="1060" y="430" width="9" height="122" rx="5" fill="#b5782b"/>
    <rect x="1401" y="444" width="20" height="13" fill="none" stroke="#b5782b" stroke-width="2"/>
    <rect x="1395" y="450" width="20" height="13" fill="#ffffff" stroke="#b5782b" stroke-width="2"/>
  </g>
  <text x="1250" y="461" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="1250" y="495" text-anchor="middle" class="component-name">Payment Service</text>
  <text x="1250" y="521" text-anchor="middle" class="responsibility">Authorizes credit card payments · returns outcome</text>

  <!-- Menu repository component -->
  <g filter="url(#shadow)">
    <rect x="260" y="720" width="390" height="122" rx="12" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="260" y="720" width="9" height="122" rx="5" fill="#3e8b6b"/>
    <rect x="611" y="734" width="20" height="13" fill="none" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="605" y="740" width="20" height="13" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
  </g>
  <text x="455" y="751" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="455" y="785" text-anchor="middle" class="component-name">Menu Repository</text>
  <text x="455" y="811" text-anchor="middle" class="responsibility">Stores coffee types · sizes · prices</text>

  <!-- Receipt printer adapter component -->
  <g filter="url(#shadow)">
    <rect x="950" y="720" width="420" height="122" rx="12" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="950" y="720" width="9" height="122" rx="5" fill="#3e8b6b"/>
    <rect x="1331" y="734" width="20" height="13" fill="none" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="1325" y="740" width="20" height="13" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
  </g>
  <text x="1160" y="751" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="1160" y="785" text-anchor="middle" class="component-name">Receipt Printer Adapter</text>
  <text x="1160" y="811" text-anchor="middle" class="responsibility">Formats order details · controls printer hardware</text>

  <!-- Interface 1: UI requires, Order Manager provides -->
  <path d="M800 309 L800 414" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M789 317 A11 11 0 0 0 811 317" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="800" cy="430" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="830" y="341" width="252" height="50" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="850" cy="358" r="10" fill="#2f6fad"/><text x="850" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="869" y="361" class="interface-label">Order API</text>
  <text x="850" y="381" class="interface-detail">in-process calls · selections / order state</text>

  <!-- Interface 2: Order Manager requires, Payment Service provides -->
  <path d="M830 491 L1044 491" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M841 480 A11 11 0 0 0 841 502" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="1060" cy="491" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="850" y="416" width="190" height="53" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="870" cy="434" r="10" fill="#b5782b"/><text x="870" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="889" y="437" class="interface-label">Payment API</text>
  <text x="870" y="458" class="interface-detail">service call · card / authorization</text>

  <!-- Interface 3: Order Manager requires, Menu Repository provides -->
  <path d="M560 552 L560 607 L455 607 L455 704" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M549 560 A11 11 0 0 0 571 560" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="455" cy="720" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="282" y="590" width="255" height="52" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="302" cy="608" r="10" fill="#3e8b6b"/><text x="302" y="612" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="321" y="611" class="interface-label">Menu Query Interface</text>
  <text x="302" y="632" class="interface-detail">SQL query · catalogue / pricing</text>

  <!-- Interface 4: Order Manager requires, Printer Adapter provides -->
  <path d="M700 552 L700 607 L1160 607 L1160 704" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M689 560 A11 11 0 0 0 711 560" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="1160" cy="720" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="868" y="590" width="272" height="52" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="888" cy="608" r="10" fill="#3e8b6b"/><text x="888" y="612" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="907" y="611" class="interface-label">Printer Port</text>
  <text x="888" y="632" class="interface-detail">USB / driver call · receipt data</text>

  <!-- Footer legend -->
  <rect x="70" y="915" width="1460" height="54" rx="12" fill="#ffffff" stroke="#d7dee9"/>
  <text x="96" y="948" font-size="13" font-weight="700" fill="#243752">NOTATION</text>
  <circle cx="210" cy="942" r="7" fill="#ffffff" stroke="#47617f" stroke-width="2.5"/>
  <text x="225" y="947" class="legend">Provided interface</text>
  <path d="M382 934 A9 9 0 0 0 382 950" fill="none" stroke="#47617f" stroke-width="2.5"/>
  <text x="399" y="947" class="legend">Required interface</text>
  <line x1="550" y1="942" x2="602" y2="942" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="616" y="947" class="legend">Request data flow; response returns on the same connector</text>
  <text x="1500" y="947" text-anchor="end" class="legend">5 components · 4 interfaces</text>
</svg>
</body>
</html>
