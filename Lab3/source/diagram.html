<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLPCRA UML Component Diagram</title>
<style>
  @page { size: 13.333in 8.333in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; background: #f5f7fb; }
  body { font-family: "Segoe UI", Arial, sans-serif; }
  svg { display: block; width: 1600px; height: 1000px; }
  .hero-title { font-size: 32px; font-weight: 700; fill: #ffffff; }
  .hero-subtitle { font-size: 17px; fill: #dce8f6; }
  .layer-title { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #40536f; }
  .component-name { font-size: 20px; font-weight: 700; fill: #14233b; }
  .stereotype { font-size: 14px; fill: #5c6d84; }
  .responsibility { font-size: 13px; fill: #46566f; }
  .interface-label { font-size: 13px; font-weight: 600; fill: #21334f; }
  .interface-detail { font-size: 11.5px; fill: #607089; }
  .legend { font-size: 13px; fill: #52637d; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 1000" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Micro Lending and Peer Credit Risk Assessor Layered Architecture UML Component Diagram</title>
  <desc id="diagramDesc">Six components arranged in presentation, application services, and security and data layers, connected by six labeled provided and required interfaces.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#152544" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#47617f"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f7fb"/>
  <rect width="1600" height="116" fill="#163b66"/>
  <rect x="70" y="72" width="126" height="6" rx="3" fill="#f1b84b"/>
  <text x="70" y="54" class="hero-title">Micro Lending and Peer Credit Risk Assessor</text>
  <text x="70" y="94" class="hero-subtitle">UML component diagram · selected pattern: Layered Architecture</text>
  <g transform="translate(1260 28)">
    <rect width="270" height="60" rx="12" fill="#ffffff" opacity="0.12"/>
    <text x="22" y="25" font-size="12" font-weight="700" fill="#f1b84b" letter-spacing="1.2">LAB 3</text>
    <text x="22" y="46" font-size="14" fill="#ffffff">PES2UG24CS036</text>
  </g>

  <rect x="70" y="145" width="1460" height="170" rx="18" fill="#edf4fb" stroke="#c9d9ec" stroke-width="2"/>
  <text x="96" y="177" class="layer-title">PRESENTATION LAYER</text>
  <rect x="70" y="335" width="1460" height="300" rx="18" fill="#f3f0fb" stroke="#d7ceed" stroke-width="2"/>
  <text x="96" y="367" class="layer-title">APPLICATION SERVICES LAYER</text>
  <rect x="70" y="655" width="1460" height="235" rx="18" fill="#eef8f3" stroke="#cbe4d7" stroke-width="2"/>
  <text x="96" y="687" class="layer-title">SECURITY AND DATA LAYER</text>

  <!-- Client portal -->
  <g filter="url(#shadow)">
    <rect x="610" y="190" width="380" height="96" rx="12" fill="#ffffff" stroke="#2f6fad" stroke-width="2"/>
    <rect x="610" y="190" width="9" height="96" rx="5" fill="#2f6fad"/>
    <rect x="951" y="204" width="20" height="13" fill="none" stroke="#2f6fad" stroke-width="2"/>
    <rect x="945" y="210" width="20" height="13" fill="#ffffff" stroke="#2f6fad" stroke-width="2"/>
  </g>
  <text x="800" y="219" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="800" y="249" text-anchor="middle" class="component-name">Borrower and Lender Portal</text>
  <text x="800" y="272" text-anchor="middle" class="responsibility">Financial profiles · loan status · repayment views</text>

  <!-- Credit risk engine -->
  <g filter="url(#shadow)">
    <rect x="150" y="420" width="350" height="118" rx="12" fill="#ffffff" stroke="#b5782b" stroke-width="2"/>
    <rect x="150" y="420" width="9" height="118" rx="5" fill="#b5782b"/>
    <rect x="461" y="434" width="20" height="13" fill="none" stroke="#b5782b" stroke-width="2"/>
    <rect x="455" y="440" width="20" height="13" fill="#ffffff" stroke="#b5782b" stroke-width="2"/>
  </g>
  <text x="325" y="450" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="325" y="483" text-anchor="middle" class="component-name">Credit Risk Engine</text>
  <text x="325" y="508" text-anchor="middle" class="responsibility">Validates profiles · assesses borrower risk</text>

  <!-- Loan management service -->
  <g filter="url(#shadow)">
    <rect x="625" y="405" width="350" height="148" rx="12" fill="#ffffff" stroke="#7656b4" stroke-width="2.5"/>
    <rect x="625" y="405" width="9" height="148" rx="5" fill="#7656b4"/>
    <rect x="936" y="419" width="20" height="13" fill="none" stroke="#7656b4" stroke-width="2"/>
    <rect x="930" y="425" width="20" height="13" fill="#ffffff" stroke="#7656b4" stroke-width="2"/>
  </g>
  <text x="800" y="437" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="800" y="472" text-anchor="middle" class="component-name">Loan Management Service</text>
  <text x="800" y="499" text-anchor="middle" class="responsibility">Coordinates profiles · loan decisions · account state</text>
  <text x="800" y="521" text-anchor="middle" class="responsibility">Enforces application workflow</text>

  <!-- Repayment service -->
  <g filter="url(#shadow)">
    <rect x="1100" y="420" width="350" height="118" rx="12" fill="#ffffff" stroke="#b5782b" stroke-width="2"/>
    <rect x="1100" y="420" width="9" height="118" rx="5" fill="#b5782b"/>
    <rect x="1411" y="434" width="20" height="13" fill="none" stroke="#b5782b" stroke-width="2"/>
    <rect x="1405" y="440" width="20" height="13" fill="#ffffff" stroke="#b5782b" stroke-width="2"/>
  </g>
  <text x="1275" y="450" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="1275" y="483" text-anchor="middle" class="component-name">Repayment Service</text>
  <text x="1275" y="508" text-anchor="middle" class="responsibility">Schedules and records repayments · triggers warnings</text>

  <!-- Authorization service -->
  <g filter="url(#shadow)">
    <rect x="240" y="745" width="390" height="112" rx="12" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="240" y="745" width="9" height="112" rx="5" fill="#3e8b6b"/>
    <rect x="591" y="759" width="20" height="13" fill="none" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="585" y="765" width="20" height="13" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
  </g>
  <text x="435" y="776" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="435" y="810" text-anchor="middle" class="component-name">Authorization Service</text>
  <text x="435" y="834" text-anchor="middle" class="responsibility">Authenticates users · checks roles and permissions</text>

  <!-- Repository -->
  <g filter="url(#shadow)">
    <rect x="920" y="745" width="440" height="112" rx="12" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="920" y="745" width="9" height="112" rx="5" fill="#3e8b6b"/>
    <rect x="1321" y="759" width="20" height="13" fill="none" stroke="#3e8b6b" stroke-width="2"/>
    <rect x="1315" y="765" width="20" height="13" fill="#ffffff" stroke="#3e8b6b" stroke-width="2"/>
  </g>
  <text x="1140" y="776" text-anchor="middle" class="stereotype">&lt;&lt;component&gt;&gt;</text>
  <text x="1140" y="810" text-anchor="middle" class="component-name">Financial and Loan Repository</text>
  <text x="1140" y="834" text-anchor="middle" class="responsibility">Profiles · loans · schedules · ACID repayment transactions</text>

  <!-- 1: Portal requires; loan management provides -->
  <path d="M800 286 L800 389" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M789 294 A11 11 0 0 0 811 294" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="800" cy="405" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="830" y="316" width="268" height="48" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="850" cy="333" r="10" fill="#2f6fad"/><text x="850" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="869" y="336" class="interface-label">Loan Management API</text>
  <text x="850" y="355" class="interface-detail">HTTPS/JSON · profile, loan and repayment views</text>

  <!-- 2: Loan management requires; risk engine provides -->
  <path d="M625 476 L516 476" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M614 465 A11 11 0 0 0 614 487" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="500" cy="476" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="398" y="369" width="230" height="49" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="418" cy="386" r="10" fill="#b5782b"/><text x="418" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="437" y="389" class="interface-label">Risk Assessment API</text>
  <text x="418" y="409" class="interface-detail">in-process · validated profile / risk result</text>

  <!-- 3: Loan management requires; repayment provides -->
  <path d="M975 476 L1084 476" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M986 465 A11 11 0 0 0 986 487" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="1100" cy="476" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="975" y="369" width="256" height="49" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="995" cy="386" r="10" fill="#b5782b"/><text x="995" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="1014" y="389" class="interface-label">Repayment API</text>
  <text x="995" y="409" class="interface-detail">service call · schedule, payment and default status</text>

  <!-- 4: Loan management requires; authorization provides -->
  <path d="M700 553 L700 610 L435 610 L435 729" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M689 561 A11 11 0 0 0 711 561" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="435" cy="745" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="250" y="590" width="250" height="49" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="270" cy="607" r="10" fill="#3e8b6b"/><text x="270" y="611" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="289" y="610" class="interface-label">Authorization API</text>
  <text x="270" y="630" class="interface-detail">middleware · identity / role decision</text>

  <!-- 5: Loan management requires; repository provides -->
  <path d="M865 553 L865 610 L1030 610 L1030 729" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M854 561 A11 11 0 0 0 876 561" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="1030" cy="745" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="688" y="590" width="292" height="49" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="708" cy="607" r="10" fill="#3e8b6b"/><text x="708" y="611" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="727" y="610" class="interface-label">Financial Profile Repository</text>
  <text x="708" y="630" class="interface-detail">parameterized SQL · profiles and loans</text>

  <!-- 6: Repayment requires; repository provides -->
  <path d="M1275 538 L1275 680 L1240 680 L1240 729" fill="none" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1264 546 A11 11 0 0 0 1286 546" fill="none" stroke="#47617f" stroke-width="3"/>
  <circle cx="1240" cy="745" r="8" fill="#ffffff" stroke="#47617f" stroke-width="3"/>
  <rect x="1090" y="650" width="330" height="49" rx="8" fill="#ffffff" stroke="#d6dee9"/>
  <circle cx="1110" cy="667" r="10" fill="#3e8b6b"/><text x="1110" y="671" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="1129" y="670" class="interface-label">Repayment Transaction Repository</text>
  <text x="1110" y="690" class="interface-detail">SQL transaction · repayment / commit status</text>

  <rect x="70" y="915" width="1460" height="54" rx="12" fill="#ffffff" stroke="#d7dee9"/>
  <text x="96" y="948" font-size="13" font-weight="700" fill="#243752">NOTATION</text>
  <circle cx="210" cy="942" r="7" fill="#ffffff" stroke="#47617f" stroke-width="2.5"/>
  <text x="225" y="947" class="legend">Provided interface</text>
  <path d="M382 934 A9 9 0 0 0 382 950" fill="none" stroke="#47617f" stroke-width="2.5"/>
  <text x="399" y="947" class="legend">Required interface</text>
  <line x1="550" y1="942" x2="602" y2="942" stroke="#47617f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="616" y="947" class="legend">Request data flow; response returns on the same connector</text>
  <text x="1500" y="947" text-anchor="end" class="legend">6 components · 6 interfaces</text>
</svg>
</body>
</html>
